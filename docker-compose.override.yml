# Local development only. `docker compose up` loads this file on its own.
# Coolify deploys with an explicit -f docker-compose.yml, so it ignores this file
# and no port is published on the server. The port binds to 127.0.0.1 only.
services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
